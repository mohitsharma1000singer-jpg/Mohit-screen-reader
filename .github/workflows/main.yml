      - name: Unpack iPhone VoiceOver sound scheme (searches repo for the zip)
        run: |
          mkdir -p app/src/main/assets/sound_iphone_voiceover
          ZIPFILE=$(find . -maxdepth 4 -iname "*iphone*voice*over*.zip" | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            echo "Found sound scheme zip at: $ZIPFILE"
            unzip -o "$ZIPFILE" -d app/src/main/assets/sound_iphone_voiceover
          else
            echo "::warning::No iPhone VoiceOver zip found in the repo (expected a filename containing iphone, voice, over and ending in .zip)."
          fi

      - name: Verify required sound files are present (fails loudly instead of shipping a silent app)
        run: |
          MISSING=""
          for f in focus2.ogg click.ogg ScreenChange.ogg Alert.ogg; do
            if [ ! -f "app/src/main/assets/sound_iphone_voiceover/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required sound files:$MISSING - check the iPhone VoiceOver zip's name/location in the repo. Stopping the build here instead of shipping a silent APK."
            exit 1
          fi
          echo "All required sound files were found."

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyScreenReader-debug-apk
          path:  app/build/outputs/apk/debug/app-debug.apk
