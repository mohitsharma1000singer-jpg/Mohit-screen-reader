name: Build MyScreenReader Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack the app source from the bundle text file in the repo
        run: |
          python3 - <<'PYEOF'
          import base64, glob, os, re, sys

          def natural(p):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)', p)]

          found = [p for p in glob.glob('**/*.txt', recursive=True)
                   if 'screen_reader_bundle' in os.path.basename(p).lower()]
          if not found:
              print('::error::No screen_reader_bundle text file found in the repo. Upload screen_reader_bundle.txt to the repo root and run again.')
              sys.exit(1)
          found.sort(key=natural)
          bundle = found[-1]
          print('Using bundle file:', bundle)
          if len(found) > 1:
              print('Other bundle files were ignored:', found[:-1])

          text = open(bundle, encoding='utf-8').read().replace('\r\n', '\n')
          files = {}
          expected = {}
          cur = None
          ended = False
          end_count = -1
          for line in text.split('\n'):
              if line.startswith('@@@BUNDLE'):
                  print('Bundle header:', line)
              elif line.startswith('@@@FILE '):
                  head, n = line[8:].rsplit(' lines=', 1)
                  cur = head.strip()
                  expected[cur] = int(n)
                  files[cur] = []
              elif line.startswith('@@@END'):
                  ended = True
                  end_count = int(line.split('count=')[1])
                  cur = None
              elif cur is not None:
                  files[cur].append(line)

          if not ended or end_count != len(files):
              print('::error::The bundle file looks incomplete or damaged (missing end marker). Upload it again.')
              sys.exit(1)
          for path, ls in files.items():
              if len(ls) != expected[path]:
                  print('::error::Damaged bundle: ' + path + ' has ' + str(len(ls)) + ' lines but should have ' + str(expected[path]) + '. Upload the bundle again.')
                  sys.exit(1)
              if path.startswith('/') or '..' in path.split('/'):
                  print('::error::Unsafe path in bundle: ' + path)
                  sys.exit(1)

          for path, ls in files.items():
              body = '\n'.join(ls) + '\n'
              if path.endswith('.b64'):
                  path = path[:-4]
                  data = base64.b64decode(''.join(body.split()))
              else:
                  data = body.encode('utf-8')
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              open(path, 'wb').write(data)
          print('Unpacked', len(files), 'files.')
          PYEOF

      - name: Unpack iPhone VoiceOver sound scheme (searches repo for the zip)
        run: |
          mkdir -p app/src/main/assets/sound_iphone_voiceover
          ZIPFILE=$(find . -maxdepth 4 -iname "*iphone*voice*over*.zip" | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            echo "Found sound scheme zip at: $ZIPFILE"
            unzip -o "$ZIPFILE" -d app/src/main/assets/sound_iphone_voiceover
          else
            echo "::warning::No iPhone VoiceOver zip found in the repo (expected a filename containing iphone, voice, over and ending in .zip)."
          fi

      - name: Verify required sound files are present (fails loudly instead of shipping a silent app)
        run: |
          MISSING=""
          for f in focus2.ogg click.ogg  ScreenChange.ogg Alert.ogg; do
            if [ ! -f "app/src/main/assets/sound_iphone_voiceover/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required sound files:$MISSING - check the iPhone VoiceOver zip's name/location in the repo. Stopping the build here instead of shipping a silent APK."
            exit 1
          fi
          echo "All required sound files were found."

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyScreenReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a GitHub Release (lets Obtainium install and update it)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyScreenReader.apk
          gh release create "build-${{ github.run_number }}" MyScreenReader.apk --title "Build ${{ github.run_number }}" --notes "Automated build" --target "${{ github.sha  }}"
