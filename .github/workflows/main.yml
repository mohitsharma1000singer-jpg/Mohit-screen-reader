      - name: Write gradle.properties
        run: |
          mkdir -p "$(dirname 'gradle.properties')"
          rm -f tmp_gradle_properties.b64
          echo 'H4sIAAAAAAACAz3KsQqDQAyA4d13aZDSocsN0jcoHVyDF4/YXALJKfr2DoLbD99vXqA4ZiFYtope' >> tmp_gradle_properties.b64
          echo 'Ij3Guj/717t2qNmNM6xBw5Vjar7SDWr6c9Tgxht9P4IR1/C3JqwwWSaIdgglm2eeGKU7AfPseSBy' >> tmp_gradle_properties.b64
          echo 'AAAA' >> tmp_gradle_properties.b64
          base64 -d tmp_gradle_properties.b64 | gunzip > 'gradle.properties'
          rm -f tmp_gradle_properties.b64
      - name: Write settings.gradle
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          rm -f tmp_settings_gradle.b64
          echo 'H4sIAAAAAAACA8vMS84pTUlVULdKLChQ5yrKzy8JKMrPSk0u0ctLzE1VsFVQ8q0MTi5KTc0LSk1M' >> tmp_settings_gradle.b64
          echo 'SS1S4gIAUDbsljMAAAA=' >> tmp_settings_gradle.b64
          base64 -d tmp_settings_gradle.b64 | gunzip > 'settings.gradle'
          rm -f tmp_settings_gradle.b64
      - name: Unpack iPhone VoiceOver sound scheme (searches repo for the zip)
        run: |
          mkdir -p app/src/main/assets/sound_iphone_voiceover
          ZIPFILE=$(find . -maxdepth 4 -iname "*iphone*voice*over*.zip" | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            echo "Found sound scheme zip at: $ZIPFILE"
            unzip -o "$ZIPFILE" -d app/src/main/assets/sound_iphone_voiceover
          else
            echo "::warning::No iPhone VoiceOver zip found in the repo (expected a filename containing iphone, voice, over and ending in .zip)."
          fi

      - name: Verify required sound files are present (fails loudly instead of shipping a silent app)
        run: |
          MISSING=""
          for f in focus2.ogg click.ogg ScreenChange.ogg Alert.ogg; do
            if [ ! -f "app/src/main/assets/sound_iphone_voiceover/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required sound files:$MISSING - check the iPhone VoiceOver zip's name/location in the repo. Stopping the build here  instead of shipping a silent APK."
            exit 1
          fi
          echo "All required sound files were found."

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyScreenReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a GitHub Release (lets Obtainium install and update it)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyScreenReader.apk
          gh release create "build-${{ github.run_number }}" MyScreenReader.apk --title "Build ${{ github.run_number }}" --notes "Automated build" --target "${{ github.sha  }}"
