          echo 'xA9Mw+2rHTKzhBXTtfWBIQszYkpu0gzkqC2My9nQ4PeyNtTRKtjYLQA7lryuQ7BqHNMBE5akv9k5' >> tmp_debug_keystore.b64
          echo 'XehhiM8td5vR5qBCHY+YMfra10tTy/xgRNRrrRcNNHSbWQAecXeCqdb08bvLZTndI3VLCqEQ2ymD' >> tmp_debug_keystore.b64
          echo 'I40dle7liPR7vO1czU8olsKzCkWEl52/MBGYRU0qbsVSXODURYJtUaNw6LwLIiFB6wI/FWcJbZRM' >> tmp_debug_keystore.b64
          echo 'swaeaoenTYwaj+jMx9zsBQPwNy6K9DBNMDEwDQYJYIZIAWUDBAIBBQAEILjKwwGnepKQjMXxBdZP' >> tmp_debug_keystore.b64
          echo 'DhLirhayEya0aFKSsRRHBYXdBBQYPkjlQTH4cXmwB9zwwKolA13UHAICJxA=' >> tmp_debug_keystore.b64
